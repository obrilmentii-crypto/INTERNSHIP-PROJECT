<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmark Manager</title>

 <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Bookmark Manager</h1>

    <form id="form">

        <input
            id="title"
            type="text"
            placeholder="Title"
        >

        <input
            id="url"
            type="text"
            placeholder="URL"
        >

        <input
            id="category"
            type="text"
            placeholder="Category"
        >

        <button type="submit">
            Add Bookmark
        </button>

    </form>

    <p id="message"></p>

    <h2>My Bookmarks</h2>

    <div id="bookmarks"></div>

    <script src="app.js"></script>

</body>

</html>
