<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bookmark Manager</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="container">

        <h1>Book & Article Bookmark Manager</h1>


        <!-- ADD BOOKMARK FORM -->

        <form id="bookmarkForm">

            <input
                type="text"
                id="title"
                placeholder="Bookmark title"
                required
            >


            <input
                type="url"
                id="url"
                placeholder="https://example.com"
                required
            >


            <input
                type="text"
                id="category"
                placeholder="Category"
            >


            <button type="submit">
                Add Bookmark
            </button>

        </form>


        <!-- MESSAGE -->

        <p id="message"></p>


        <!-- BOOKMARKS -->

        <h2>My Bookmarks</h2>

        <div id="bookmarksList"></div>

    </div>


    <script src="app.js"></script>

</body>

</html>
